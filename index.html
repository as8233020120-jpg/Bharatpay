<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>India Pay - Authentication</title>
    <!-- Supabase Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f0a1c; color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; padding: 25px; width: 100%; max-width: 400px; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); }
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { color: #f39c12; font-size: 28px; letter-spacing: 1px; }
        .header p { color: #bbb; font-size: 13px; margin-top: 5px; }
        .badges { display: flex; justify-content: center; gap: 10px; margin-top: 10px; font-size: 12px; color: #f1c40f; }
        .tabs { display: flex; background: rgba(0, 0, 0, 0.3); border-radius: 8px; padding: 4px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 10px; border: none; background: transparent; color: #fff; cursor: pointer; border-radius: 6px; font-weight: bold; transition: 0.3s; }
        .tab-btn.active { background: #f39c12; color: #000; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 13px; color: #ddd; }
        .form-group input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.2); background: rgba(0, 0, 0, 0.4); color: #fff; outline: none; }
        .form-group input:focus { border-color: #f39c12; }
        .submit-btn { width: 100%; padding: 12px; border: none; border-radius: 8px; background: linear-gradient(90deg, #f39c12, #e67e22); color: #000; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px; }
        .msg { margin-top: 15px; padding: 10px; border-radius: 6px; font-size: 13px; text-align: center; display: none; }
        .msg.error { background: rgba(231, 76, 60, 0.2); border: 1px solid #e74c3c; color: #e74c3c; display: block; }
        .msg.success { background: rgba(46, 204, 113, 0.2); border: 1px solid #2ecc71; color: #2ecc71; display: block; }
        .msg.info { background: rgba(52, 152, 219, 0.2); border: 1px solid #3498db; color: #3498db; display: block; }
        .form { display: none; }
        .form.active { display: block; }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <h1>INDIA PAY</h1>
        <p>भारत का सबसे भरोसेमंद नेटवर्क</p>
        <div class="badges">
            <span>⚡ FAST</span> • <span>🔒 SECURE</span> • <span>✨ SIMPLE</span>
        </div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" id="loginTabBtn" onclick="switchTab('login')">🔑 Login</button>
        <button class="tab-btn" id="signupTabBtn" onclick="switchTab('signup')">👤 Sign Up</button>
    </div>

    <div id="authMessage" class="msg"></div>

    <!-- LOGIN FORM -->
    <form id="loginForm" class="form active" onsubmit="handleLogin(event)">
        <div class="form-group">
            <label>Registered Email ID</label>
            <input type="email" id="loginEmail" placeholder="Enter your email" required>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="loginPassword" placeholder="Enter password" required>
        </div>
        <button type="submit" class="submit-btn">Login Now ➔</button>
    </form>

    <!-- SIGNUP FORM -->
    <form id="signupForm" class="form" onsubmit="handleSignUp(event)">
        <div class="form-group">
            <label>Email ID</label>
            <input type="email" id="signupEmail" placeholder="Enter your email" required>
        </div>
        <div class="form-group">
            <label>Create Password</label>
            <input type="password" id="signupPassword" placeholder="Create password (min 6 chars)" required minlength="6">
        </div>
        <button type="submit" class="submit-btn">Create Account ➔</button>
    </form>
</div>

<script>
    // 1. Supabase Credentials
    const SUPABASE_URL = "https://vrsvqlitruoetnwrqxrd.supabase.co"; 
    const SUPABASE_ANON_KEY = "sb_publishable_RID2VKRjuwTH5S1D7fOp0g_hqyuDwuI"; 

    let supabaseClient = null;

    try {
        if (window.supabase) {
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        }
    } catch(e) {
        console.error(e);
    }

    function switchTab(tab) {
        const loginForm = document.getElementById('loginForm');
        const signupForm = document.getElementById('signupForm');
        const loginTabBtn = document.getElementById('loginTabBtn');
        const signupTabBtn = document.getElementById('signupTabBtn');
        const authMessage = document.getElementById('authMessage');

        authMessage.style.display = 'none';

        if (tab === 'login') {
            loginForm.classList.add('active');
            signupForm.classList.remove('active');
            loginTabBtn.classList.add('active');
            signupTabBtn.classList.remove('active');
        } else {
            signupForm.classList.add('active');
            loginForm.classList.remove('active');
            signupTabBtn.classList.add('active');
            loginTabBtn.classList.remove('active');
        }
    }

    function showMsg(text, type) {
        const msgBox = document.getElementById('authMessage');
        msgBox.textContent = text;
        msgBox.className = 'msg ' + type;
    }

    async function handleSignUp(e) {
        e.preventDefault();
        if (!supabaseClient) {
            showMsg("Supabase Client setup fail hua. Anon Key sahi dalein.", "error");
            return;
        }

        const email = document.getElementById('signupEmail').value;
        const password = document.getElementById('signupPassword').value;

        showMsg("Account create ho raha hai...", "info");

        const { data, error } = await supabaseClient.auth.signUp({
            email: email,
            password: password
        });

        if (error) {
            showMsg("Error: " + error.message, "error");
        } else {
            showMsg("Success! Account ban gaya hai.", "success");
        }
    }

    async function handleLogin(e) {
        e.preventDefault();
        if (!supabaseClient) {
            showMsg("Supabase Client setup fail hua. Anon Key sahi dalein.", "error");
            return;
        }

        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPassword').value;

        showMsg("Login ho raha hai...", "info");

        const { data, error } = await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
        });

        if (error) {
            showMsg("Error: " + error.message, "error");
        } else {
            showMsg("Welcome! Login successful.", "success");
        }
    }
</script>

</body>
</html>
